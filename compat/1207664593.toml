# SimCity 4 Deluxe Edition (32-bit, Apps/SimCity 4.exe imports opengl32: L1 picks wined3d,
# and the game picks its own DirectX driver on top). Its data directory is the exe's own
# folder unless Apps/SimCity 4.ini says `[Directories] Data=`; the .dat files are in the game
# root, so without the file it stops at "Unable to find game data". The depot tree has no
# such file, and GOG's registry values don't steer it. `..\` is relative to Apps/.
# e2e/1207664593.toml.
title  = "SimCity 4 Deluxe Edition"
source = "gogo-headless"
files  = [
  { path = "Apps/SimCity 4.ini", text = "[Directories]\nData=..\\\n" },
]

[platforms.linux]
status = "boots"
lane   = "depot"
notes  = "headless sway on Xwayland: intros, the Timbuktu region view and Quit SimCity 4 work on wined3d with the files fix; on Wine's Wayland driver (gogo's display mode) it stops at \"Could not initialize Direct Draw\": the 32-bit game gets no EGL or Vulkan there (#312); audio, play and the owner's compositor not judged"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-10 },
]
