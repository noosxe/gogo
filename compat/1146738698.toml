# Carmageddon TDR 2000 (DirectDraw + Direct3D 6/7, 32-bit): wined3d (L1).
# Needs the depot's gog-support overlay (ASSETS/options.txt, L2), which gogo
# applies. In the VM it reaches its first-run "Hardware Capabilities" dialog;
# past it the game dies on FindDepthBufferFormat because the guest has no
# OpenGL, so the 3D path is unjudged until a host pass.
title  = "Carmageddon TDR 2000"
source = "gogo-vm"

[platforms.macos]
status = "boots"
notes  = "VM: reaches its first-run dialog; the 3D path past it needs a host pass (no OpenGL in the VM)"
tested = [
  { runtime = "winecx/24.0.7_7", host = "vm/macos-27.0", date = 2026-10-23 },
  { runtime = "winecx26/26.3-20261014", host = "vm/macos-27.0", date = 2026-10-24 },
]

# Linux depot lane (e2e/1146738698.toml). Under D7VK the hardware check leaves the display in
# 320x200, and the device dialog is magnified with its OK off screen and takes no input. On
# wined3d the same dialog is normal, but "Play" then shows black.
[platforms.linux]
status = "boots"
lane   = "depot"
notes  = "headless sway: stops at the first-run device dialog on D7VK, the menu isn't reached"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/software", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/radv", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-06 },
]
