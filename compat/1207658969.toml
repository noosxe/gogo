# SimCity 2000 Special Edition: GOG ships the 1993 DOS game in its bundled DOSBox
# 0.74-2 (DOSBOX/DOSBox.exe, 32-bit), with GOG's dosboxSC2000*.conf from the support
# overlay (output=ddraw, fullscreen) and a batch launcher of its own. L1 picks wined3d
# (DOSBox.exe imports opengl32); no compat fix is needed.
title  = "SimCity 2000 Special Edition"
source = "gogo-host"

# Headless sway (e2e/1207658969.toml, e2e/city-1207658969.toml), on Xwayland: GOG's
# launcher, the menu (4:3, pillarboxed, right palette), a new city with the simulation
# running, and Quit, then "5" in the launcher, exit 0. On Wine's Wayland driver the same
# route works and quits cleanly, but the 32-bit DOSBox gets no GL there (#312): DOSBox's
# ddraw output fails ("Failed to create ddraw surface") and falls back to its surface
# output, which centres 640x480 unscaled. The host pass on Hyprland (NVIDIA
# RTX 4090, GE-Proton11-12) plays on both Xwayland and Wine's Wayland driver; on Wayland
# the unscaled, centred 640x480 (#312) is accepted as a pass, so no display pin.
[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "host pass on Hyprland (NVIDIA RTX 4090): plays on both Xwayland and Wine's Wayland driver; on Wayland it draws 640x480 unscaled and centred since 32-bit DOSBox gets no GL there for its ddraw output (#312), which @noosxe accepts as a pass; headless sway (Xwayland): GOG's DOSBox launcher, the menu, a new city and quitting work, 4:3 scaled"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-10 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "hyprland", version = "0.57.1" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-11 },
]
