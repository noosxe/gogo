# Zeus + Poseidon (2D DirectDraw: cnc-ddraw). e2e/1207659039.toml. Entry Zeus.exe.
# GOG's support installer (galaxy_zeus_and_poseidon_2.1.0.10.exe) declines in the
# build (exit 1, InitializeSetup returned False); its gog-support holds only that
# installer, no app/ overlay files, and the game doesn't need it. The Linux rows were
# a human-watched host pass (gogo-host) plus headless runs.
title  = "Zeus + Poseidon"
source = "gogo-host"

[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "host pass on Hyprland (NVIDIA RTX 4090), built with gogo (depot lane, cnc-ddraw, entry Zeus.exe): everything works on both Wine's Wayland driver and Xwayland (intro with sound, menu, mouse, a play session, quitting, fullscreen vs windowed); GOG's support installer declines (exit 1, InitializeSetup returned False) and the game doesn't need it; needs an audio device (headless with none used to crash, #204, closed)"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "mesa-llvmpipe", version = "26.2.6" }, date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "hyprland", version = "0.57.1" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-11 },
]
