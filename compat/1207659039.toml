title  = "Zeus + Poseidon"
source = "gogo-host"

[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "owner's host pass on Hyprland (NVIDIA RTX 4090), built with gogo (depot lane, cnc-ddraw, entry Zeus.exe): everything works on both Wine's Wayland driver and Xwayland (intro with sound, menu, mouse, a play session, quitting, fullscreen vs windowed); GOG's support installer declines (exit 1, InitializeSetup returned False) and the game doesn't need it; needs an audio device (headless with none used to crash, #204, closed)"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/software", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "kraken-hyprland/nvidia", date = 2026-11-11 },
