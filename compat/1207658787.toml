# Heroes of Might and Magic 3: Complete (2D DirectDraw, 32-bit). GOG patched
# Heroes3.exe to import DirectDrawCreate from xdd.dll, which is DDrawCompat
# renamed, and DDrawCompat doesn't run under Wine (exit 9). gogo's L1 sees that
# by itself and puts its cnc-ddraw in under that name (#306), so no renderer key
# here. e2e/1207658787.toml.
title  = "Heroes of Might and Magic 3: Complete"
source = "gogo-host"

# The Mac picks wined3d for it and can't run it yet (#307): no [platforms.macos].

[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "host pass on Hyprland (NVIDIA RTX 4090), built with gogo (depot lane, cnc-ddraw standing in for GOG's DDrawCompat xdd.dll): everything works on both Wine's Wayland driver and Xwayland (intros and music, 4:3 scaling, mouse, a play session, Quit to Desktop, pointer lock, fullscreen vs windowed); headless sway agreed on both display modes"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-10 },
  { runtime = "ge-proton/GE-Proton11-12", host = "kraken-hyprland/nvidia", date = 2026-11-10 },
]
