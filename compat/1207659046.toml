# Pharaoh + Cleopatra (Pharaoh Gold; 2D DirectDraw, 32-bit): cnc-ddraw (L1).
# From the depot it shows "Please insert your Cleopatra CD.": the tree lacks
# the installer-written Pharaoh.ini (CDDrive), and GOG's support installer
# declines to run (docs/18 §5). The offline installer lane writes the config
# (#56): the [platforms.macos] status is the depot build's,
# [platforms.macos.lanes.installer] the installer build's.
title  = "Pharaoh + Cleopatra"
source = "gogo-host"

[platforms.macos]
status = "broken"
lane   = "depot"
notes  = "from the depot it asks for the Cleopatra CD (no installer-written Pharaoh.ini, docs/18 §5); build it from the offline installer"
tested = [{ runtime = "winecx/24.0.7_7", host = "vm/macos-27.0", date = 2026-10-23 }]

# setup_pharaoh_gold_2.1.0.15.exe (#134): the VM smoke run reached the title
# screen with no CD prompt; the host pass was judged playable by eye.
# winecx26 (docs/20 §3): plays on the host; in the VM it spins in a d3dkmt
# OpenAdapterFromHdc loop with no window, so it has no VM row.
[platforms.macos.lanes.installer]
status = "plays"
tested = [
  { runtime = "winecx/24.0.7_7", host = "vm/macos-27.0", date = 2026-10-23 },
  { runtime = "winecx/24.0.7_7", host = "m4pro/macos-27.0.1", date = 2026-10-23 },
  { runtime = "winecx26/26.3-20261014", host = "m4pro/macos-27.0.1", date = 2026-10-24 },
]

# Linux depot lane (e2e/1207659046.toml): no CD prompt, the overlay's Pharaoh.ini is enough.
[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "owner's host pass on Hyprland (NVIDIA RTX 4090), built with gogo (depot lane, cnc-ddraw): everything works on both Wine's Wayland driver and Xwayland (intros and music, 4:3 scaling, mouse, a play session, quitting, pointer lock, fullscreen vs windowed); the depot build needs no CD prompt; headless sway agreed on both display modes"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/software", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/radv", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", host = "headless-sway/nvidia", date = 2026-11-10 },
  { runtime = "ge-proton/GE-Proton11-12", host = "kraken-hyprland/nvidia", date = 2026-11-11 },
]
