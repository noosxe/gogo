# Pinball Spire (Unity 6, D3D11 by default though it ships D3D12Core: DXVK, the L1 default).
# Plays on both Xwayland and Wine's Wayland driver on a Hyprland/NVIDIA desktop, so no `display` pin.
# With -force-d3d12 it also reached the menu and Options on VKD3D-Proton in all three headless modes.
title  = "Pinball Spire"
source = "gogo-host"

[platforms.linux]
status = "plays"
lane   = "depot"
notes  = "host pass on Hyprland (NVIDIA RTX 4090): works well on both Xwayland and Wine's Wayland driver, on DXVK; no display pin. Headless sway before that: menu, Options and Quit Game work on DXVK, and on VKD3D-Proton with -force-d3d12"
tested = [
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "mesa-llvmpipe", version = "26.2.6" }, date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "mesa-radv", version = "26.2.6" }, date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "sway", version = "1.12" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-06 },
  { runtime = "ge-proton/GE-Proton11-12", compositor = { name = "hyprland", version = "0.57.1" }, gpu_driver = { vendor = "nvidia", version = "595.112.07" }, date = 2026-11-11 },
]
