# Cyberpunk 2077 (64-bit, D3D12): gogo's Linux lane picks VKD3D-Proton by
# default (#228). Built from the user's offline installer, not the depot:
#
#   scripts/linux-e2e.sh run 1423049311 --installer <setup_cyberpunk_2077_….exe> \
#       --gpu renderD129 --expect-gpu renderD129
#
# First launch, every run (scratch is fresh): warnings, then the intro video
# with "Press space to continue", CD Projekt Red's user agreement (the video
# ends in it by itself, in about 90 s), then the main menu under an analytics
# prompt. @noosxe OKs accepting the agreement in the harness's throw-away
# prefix (#238); analytics is declined. Then Settings -> Graphics, read only,
# for DLSS, Frame Generation, Reflex and ray tracing (#232), Quit Game, and a
# second launch on the disk that remembers all that: intro, menu, Quit Game.
#
# Nothing here is timed against the intro, or assumes where the menu's focus is
# (#266, #262): a colour in a region says what's on screen (press_until,
# docs/linux-e2e.md). No key goes in on a guess, so no Return lands on the wrong
# item. They're for this resolution. The screens are animated: no wait_settled.
#
# Keys only past the title: the game draws its own cursor from relative mouse
# input, so `click` doesn't aim. The agreement scrolls with the wheel only.
# In Settings, 1 and 3 switch tabs and Down moves the focus; Left, Right,
# A, D, Return and F1 (Restore Defaults) would change something, so none is
# pressed there.
#
# The menu's focus, by key (read off screenshots). Down goes New Game, Load
# Game, Settings, Credits, Quit Game, the Phantom Liberty banner, My Rewards,
# then swaps My Rewards and the version box at the top right for good. Left
# swaps the banner and My Rewards, and New Game and the version box. Up climbs
# from the banner. So from anywhere: Down until My Rewards is framed, Left to the
# banner, Up until the item is framed. The frame is yellow, its corners cyan; a
# row without it has neither. Neither Left nor Down opens anything.
title = "Cyberpunk 2077"
gogid = 1423049311

[window]
wait_secs = 900
resolution = "1920x1080"

# Logging only: which DLLs load (d3d12, nvngx, Streamline), VKD3D-Proton's
# device and DXR tier, dxvk-nvapi.
[env]
WINEDEBUG = "+loaddll"
VKD3D_DEBUG = "info"
DXVK_LOG_LEVEL = "info"
DXVK_NVAPI_LOG_LEVEL = "info"

# Past the launcher, and the title up in about 30 s, not 150.
[override]
extra_args = ["--launcher-skip", "-skipStartScreen"]

# Quit Game ends it.
[exit]
how = "self"
wait_secs = 60

# The video's own moves are no use here: 70% of its pixels differ in half a
# second. Its prompt is the title.

[[step]]
wait_until = { every = 1, max = 180, marked = { x = 78.6, y = 85.1, w = 14.9, h = 3, color = "#e85048", tol = 50, min = 10 } }

[[step]]
screenshot = "title"
min_fill = false

# Through the persistent virtual keyboard: wtype's keys never got here (#236).
# The panel of the agreement is the only dark navy there.

[[step]]
press_until = { key = "space", every = 3, max = 40, marked = { x = 42, y = 33, w = 36, h = 40, color = "#0c0c16", tol = 10, min = 60 } }

[[step]]
screenshot = "agreement"

[[step]]
expect_change = { from = "title", to = "agreement", min = 20 }

# Accept needs the agreement scrolled to its end: about 500 notches, so 750.

[[step]]
scroll = 250

[[step]]
wait = 1

[[step]]
scroll = 250

[[step]]
wait = 1

[[step]]
scroll = 250

[[step]]
wait = 3

[[step]]
screenshot = "agreement-end"

[[step]]
expect_change = { from = "agreement", to = "agreement-end", min = 5 }

# Return is Accept (@noosxe's OK, #238), pressed once: a second one could land
# on the analytics prompt, which is always declined. The menu comes up under the
# prompt, with its red buttons where the agreement has white text.

[[step]]
key = "Return"

[[step]]
wait_until = { every = 1, max = 60, marked = { x = 36, y = 54, w = 8, h = 3.5, color = "#ff4a4a", tol = 50, min = 3 } }

[[step]]
screenshot = "analytics"

[[step]]
expect_change = { from = "agreement-end", to = "analytics", min = 20 }

# C is "No, I do not agree", once. The prompt dims the logo until it goes.

[[step]]
key = "c"

[[step]]
wait_until = { every = 1, max = 30, marked = { x = 5.7, y = 16.7, w = 26.6, h = 11.1, color = "#f8e800", tol = 30, min = 3 } }

[[step]]
screenshot = "menu"

[[step]]
expect_change = { from = "analytics", to = "menu", min = 5 }

# The focus to Settings, framed, then in.

[[step]]
press_until = { key = "Down", every = 0.7, max = 12, marked = { x = 71, y = 89.6, w = 25.3, h = 6.7, color = "#20f0f0", tol = 40, min = 0.4 } }

[[step]]
key = "Left"

[[step]]
wait = 0.7

[[step]]
press_until = { key = "Up", every = 0.7, max = 6, marked = { x = 9.1, y = 49.1, w = 21.2, h = 3, color = "#f0e640", tol = 40, min = 2 } }

[[step]]
screenshot = "on-settings"

[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
screenshot = "settings"

[[step]]
expect_change = { from = "on-settings", to = "settings", min = 20 }

# 3 is the next tab: Sound, Controls, Gameplay, Graphics.

[[step]]
key = "3"

[[step]]
wait = 2

[[step]]
key = "3"

[[step]]
wait = 2

[[step]]
key = "3"

[[step]]
wait = 2

[[step]]
