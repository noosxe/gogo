# Carmageddon TDR 2000 (D3D7: wined3d, see compat/1146738698.toml). First run: the hardware
# check's OK, the Display Configuration dialog (640x480, Play), then its audio check, the
# studio videos and the main menu.
#
# The audio check hangs on a black screen without an audio device: DirectSound fails, then
# it writes to a waveOut handle that never completes (#203). The sandbox's null sink is what
# gets it past that.
#
# On the menu, Escape opens the "Quit TDR 2000?" confirm dialog. (Return picks the button
# under the game's cursor, Load Game. Up to #236 the manifest said Return, but wtype sent
# every key on the keycode that is Escape's on a real keyboard, so the game got Escape.)
#
# The menu reads the mouse through exclusive, relative DirectInput and draws its own cursor,
# and while Wine holds that grab the compositor's pointer stays put. So `click` can't aim here,
# wherever it says: a manifest steers like a hand does. A big `move_by` pins the cursor in the
# picture's top-left corner, where it clamps, then a second one goes to the target. One unit
# of `move_by` is about 0.637 pixels of a 1280x800 output, and the 640x480 picture starts at
# x = 108.
title = "Carmageddon TDR 2000"
gogid = 1146738698

[window]
wait_secs = 240
resolution = "1280x800"
min_fill = { w = 80, h = 95 }

[[step]]
wait = 15

[[step]]
screenshot = "first-run-dialog"
min_fill = false

# OK. Coordinates are percent of the window: here, the dialog.
[[step]]
click = { x = 37.3, y = 80.6 }

[[step]]
wait = 30

[[step]]
screenshot = "device-dialog"
min_fill = false

[[step]]
expect_change = { from = "first-run-dialog", to = "device-dialog", min = 10 }

# 640x480 in the resolution list, then Play.
[[step]]
click = { x = 62.7, y = 65 }

[[step]]
wait = 2

[[step]]
click = { x = 50, y = 90.9 }

[[step]]
wait = 15

# Escape skips a video. The narrative and intro videos then play out.
[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
wait_settled = 300

[[step]]
screenshot = "menu"

# Escape on the menu: the quit confirm dialog.
[[step]]
key = "Escape"

[[step]]
wait = 5

[[step]]
screenshot = "after-escape"
min_fill = false

[[step]]
expect_change = { from = "menu", to = "after-escape", min = 5 }

# No, 557 x 436 pixels from the corner.
[[step]]
move_by = { x = -3000, y = -3000 }

[[step]]
wait = 1

[[step]]
move_by = { x = 874, y = 684 }

[[step]]
wait = 2

[[step]]
screenshot = "on-no"
min_fill = false

[[step]]
click_here = true

[[step]]
wait = 5

[[step]]
screenshot = "after-no"
min_fill = false

[[step]]
expect_change = { from = "on-no", to = "after-no", min = 5 }
