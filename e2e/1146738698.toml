# Carmageddon TDR 2000 (D3D7: wined3d, see compat/1146738698.toml). First run: the hardware
# check's OK, the Display Configuration dialog (640x480, Play), then its audio check, the
# studio videos and the main menu.
#
# The audio check hangs on a black screen without an audio device: DirectSound fails, then
# it writes to a waveOut handle that never completes (#203). The sandbox's null sink is what
# gets it past that.
#
# On the menu, Return registers now that a key is held 50 ms (3 of 3 runs): the menu's focus
# is on Quit, so it opens the "Quit TDR 2000?" confirm dialog, which the steps stop at. Clicks
# still don't register there, though the button is held 100 ms: the hold isn't the cause
# (a click on "No" changed 0.1% of the picture, 2 of 2 runs). The host pass judges the
# menu's mouse input.
title = "Carmageddon TDR 2000"
gogid = 1146738698

[window]
wait_secs = 240
resolution = "1280x800"
min_fill = { w = 80, h = 95 }

[[step]]
wait = 15

[[step]]
screenshot = "first-run-dialog"
min_fill = false

# OK. Coordinates are percent of the window: here, the dialog.
[[step]]
click = { x = 37.3, y = 80.6 }

[[step]]
wait = 30

[[step]]
screenshot = "device-dialog"
min_fill = false

[[step]]
expect_change = { from = "first-run-dialog", to = "device-dialog", min = 10 }

# 640x480 in the resolution list, then Play.
[[step]]
click = { x = 62.7, y = 65 }

[[step]]
wait = 2

[[step]]
click = { x = 50, y = 90.9 }

[[step]]
wait = 15

# Return skips a video. The narrative and intro videos then play out.
[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
wait_settled = 300

[[step]]
screenshot = "menu"

# Return on the menu: the held key opens the quit confirm dialog.
[[step]]
key = "Return"

[[step]]
wait = 5

[[step]]
screenshot = "after-return"
min_fill = false

[[step]]
expect_change = { from = "menu", to = "after-return", min = 5 }
