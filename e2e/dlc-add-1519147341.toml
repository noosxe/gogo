# Journey to the Savage Planet, base game only, then its Hot Garbage DLC added to the
# built game on the offline-installer lane (#351, design 19 section 5). Run with
# `--installer <dir>/setup_journey_to_the_savage_planet_<version>_(<build>).exe`.
# The first add is stopped (SIGINT to its process group) once the DLC's installer
# runs, and must leave its journal; the bare add after it runs the installer again
# and finishes. `installer_dlc_dir` then finds the DLC's goggame info in the base
# game's dir and nowhere else in the prefix.
title = "Journey to the Savage Planet"
gogid = 1519147341

# The base comes from the harness's mount, not a gogo download: its installer's
# language isn't recorded, so each add names it.
[[installer_dlc.add]]
args = ["Hot Garbage", "--lang", "en"]
interrupt = "gogo-setup.setup_journey_to_the_savage_planet_hot_garbage"

# A bare add (no DLC named): it finishes the stopped one.
[[installer_dlc.add]]
args = ["--lang", "en"]

[window]
wait_secs = 300

[[step]]
wait = 45

[[step]]
screenshot = "start"
