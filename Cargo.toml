[workspace]
resolver = "3"
members = [
    "crates/gogo-core",
    "crates/gogo-cli",
    "crates/gogo-shims",
    "crates/gogo-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levon Kirakosyan"]
# Dual-licensed (ecosystem standard: Apache-2.0 adds the explicit patent grant,
# MIT stays GPLv2-compatible). Copyright 2026 Levon Kirakosyan.
# Distribution is GitHub-only (git + releases) — crates.io is deliberately out.
license = "MIT OR Apache-2.0"
publish = false

# Every shared dependency is pinned HERE, once (docs/design/01 §1).
# Member manifests only say `dep.workspace = true`.
[workspace.dependencies]
# — internal —
gogo-core = { path = "crates/gogo-core", version = "0.1.0" }
gogo-shims = { path = "crates/gogo-shims", version = "0.1.0" }

# — async / HTTP (rustls only: one TLS stack shared with gog-warp; no gzip) —
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
futures = "0.3.34"
tokio-util = "0.7.20"
async-trait = "0.1"
governor = "0.10.4"

# — data formats —
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Comment-preserving `gogo config set` round-trip (review D7).
toml_edit = "0.25"
quick-xml = "0.42.0"
md-5 = "0.11.0"
sha2 = "0.10"
cab = "0.6"
sevenz-rust2 = "0.24"
url = "2.5.8"
# RFC 3339 timestamps in InstallRecord (already in-tree via gog-warp).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }

# — errors / secrets —
thiserror = "2.0.21"
anyhow = "1.0.104"
# Platform stores (design 01 §5, review D6): macOS native / Linux secret-service (sync).
keyring = { version = "4.2.0", features = ["v1", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
zeroize = "1.9.1"

# — dirs / UX —
dirs = "7.0.0"
indicatif = "0.18.6"
console = "0.16.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
comfy-table = "8.0.1"
bytesize = "2.7.0"
fs4 = { version = "1.1.0", features = ["sync"] }

# — logging —
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# — CLI —
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

# — GOG auth/tokens/owned-ids (docs/10: not on crates.io — rev-pinned, scope per docs/design/01 §2) —
# Pinned at the merge of playtron-os/gog-warp#5 (macOS file pre-allocation;
# docs/17 §5, design 14).
gog-warp = { git = "https://github.com/playtron-os/gog-warp", rev = "26c9e671589edf643fdb36678848f4420f9d3d41" }

# — dev —
wiremock = "0.6"
tempfile = "3"
proptest = "1"
