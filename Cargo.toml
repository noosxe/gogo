[package]
name = "gogo"
version = "0.1.0"
edition = "2024"
description = "GOG.com library lister and offline-installer downloader"
publish = false

[dependencies]
# CLI (docs/design/03)
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

# Async / HTTP (rustls only — one TLS stack shared with gog-warp; no gzip: CDN handles range + md5 fine)
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3.34"
tokio-util = "0.7.20"
async-trait = "0.1"

# Rate limiting
governor = "0.10.4"

# Data formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
quick-xml = "0.42.0"
md-5 = "0.11.0"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

# Errors / secrets
thiserror = "2.0.21"
anyhow = "1.0.104"
keyring = "4.2.0"
zeroize = "1.9.1"

# Dirs / UX
dirs = "7.0.0"
indicatif = "0.18.6"
console = "0.16.6"
dialoguer = "0.12.0"
comfy-table = "8.0.1"
bytesize = "2.7.0"

# Disk (free-space preflight, state lock)
fs4 = { version = "1.1.0", features = ["sync"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GOG auth/tokens/owned-ids (docs/10: not on crates.io — rev-pinned, scope per docs/design/01 §2)
gog-warp = { git = "https://github.com/playtron-os/gog-warp", rev = "55ddb010be07d41357144440be3fda65fbb8993a" }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
