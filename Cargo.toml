[workspace]
resolver = "3"
members = [
    "crates/gogo-core",
    "crates/gogo-cli",
    "crates/gogo-shims",
    "crates/gogo-tui",
    # Desktop GUI (docs/design/24 §2).
    "crates/gogo-contract",
    "crates/gogo-ui-ir",
    "crates/gogo-skin",
    "crates/gogo-skins",
    "crates/gogo-ui-text",
    "crates/gogo-ui-layout",
    "crates/gogo-ui-scene",
    "crates/gogo-render-cpu",
    "crates/gogo-render-gpu",
    "crates/gogo-ui-interact",
    "crates/gogo-ui-a11y",
    "crates/gogo-ui-shell",
    "crates/gogo-gui-model",
    "crates/gogo-gui-testkit",
    "crates/gogo-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levon Kirakosyan"]
# Dual-licensed (ecosystem standard: Apache-2.0 adds the explicit patent grant,
# MIT stays GPLv2-compatible). Copyright 2026 Levon Kirakosyan.
# Distribution is GitHub-only (git + releases) — crates.io is deliberately out.
license = "MIT OR Apache-2.0"
publish = false

# Every shared dependency is pinned HERE, once (docs/design/01 §1).
# Member manifests only say `dep.workspace = true`.
[workspace.dependencies]
# — internal —
gogo-core = { path = "crates/gogo-core", version = "0.1.0" }
gogo-shims = { path = "crates/gogo-shims", version = "0.1.0" }
# Desktop GUI crates (docs/design/24 §2; dependency rules in §2.1, checked by
# scripts/gui-deps-check.py).
gogo-contract = { path = "crates/gogo-contract", version = "0.1.0" }
gogo-ui-ir = { path = "crates/gogo-ui-ir", version = "0.1.0" }
gogo-skin = { path = "crates/gogo-skin", version = "0.1.0" }
gogo-skins = { path = "crates/gogo-skins", version = "0.1.0" }
gogo-ui-text = { path = "crates/gogo-ui-text", version = "0.1.0" }
gogo-ui-layout = { path = "crates/gogo-ui-layout", version = "0.1.0" }
gogo-ui-scene = { path = "crates/gogo-ui-scene", version = "0.1.0" }
gogo-render-cpu = { path = "crates/gogo-render-cpu", version = "0.1.0" }
gogo-render-gpu = { path = "crates/gogo-render-gpu", version = "0.1.0" }
gogo-ui-interact = { path = "crates/gogo-ui-interact", version = "0.1.0" }
gogo-ui-a11y = { path = "crates/gogo-ui-a11y", version = "0.1.0" }
gogo-ui-shell = { path = "crates/gogo-ui-shell", version = "0.1.0" }
gogo-gui-model = { path = "crates/gogo-gui-model", version = "0.1.0" }
gogo-gui-testkit = { path = "crates/gogo-gui-testkit", version = "0.1.0" }

# — async / HTTP (rustls only: one TLS stack shared with gog-warp; no gzip) —
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
futures = "0.3.34"
tokio-util = "0.7.20"
async-trait = "0.1"
governor = "0.10.4"

# — data formats —
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Comment-preserving `gogo config set` round-trip (review D7).
toml_edit = "0.25"
quick-xml = "0.42.0"
md-5 = "0.11.0"
sha2 = "0.10"
cab = "0.6"
sevenz-rust2 = "0.24"
url = "2.5.8"
# Time: RFC 3339 text, file mtimes, local dates (gogo::time). No serde feature:
# every serialized time goes through gogo's own helpers. chrono stays in the
# tree only through gog-warp.
jiff = { version = "1.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
uuid = { version = "1", features = ["v4", "serde"] }
# PE import scan for mac-app renderer selection (#63); read-only PE, no write/compression.
# `gogo search` text matching (design 17 §4): NFKD folding, "did you mean" distance.
unicode-normalization = "0.1"
strsim = "0.11"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }

# — errors / secrets —
thiserror = "2.0.21"
anyhow = "1.0.104"
# Platform stores (design 01 §5, review D6): macOS native / Linux secret-service (sync).
keyring = { version = "4.2.0", features = ["v1", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
zeroize = "1.9.1"

# — dirs / UX —
dirs = "7.0.0"
indicatif = "0.18.6"
console = "0.16.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
comfy-table = "8.0.1"
bytesize = "2.7.0"
fs4 = { version = "1.1.0", features = ["sync"] }
# FICLONE for depot materialization on Linux (design 18 §6); already in-tree via zbus.
rustix = { version = "1.1.5", features = ["fs", "process"] }

# — logging —
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Tests only: dependencies (gog-warp) log through `log`, bridged into tracing.
log = "0.4"
tracing-log = "0.2"

# — CLI —
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

# — GOG auth/tokens/owned-ids (docs/10: not on crates.io — rev-pinned, scope per docs/design/01 §2) —
# Pinned at the merge of playtron-os/gog-warp#5 (macOS file pre-allocation;
# docs/17 §5, design 14).
gog-warp = { git = "https://github.com/playtron-os/gog-warp", rev = "26c9e671589edf643fdb36678848f4420f9d3d41" }

# — desktop GUI stack (docs/design/24 §3, decision 7) —
# Exact pins, bumped together as one batch in a deliberate PR (they move in
# lockstep: vello pins a wgpu major, accesskit_winit pins winit 0.30). Declared
# here so each GUI PR only references them; cargo resolves a workspace
# dependency into Cargo.lock only once a member uses it.
taffy = "=0.16.0"
# Text: no system fonts by default (decision 10); gogo-ui-text's `system-fonts`
# feature turns them on as a fallback.
parley = { version = "=0.13.0", default-features = false, features = ["std"] }
fontique = { version = "=0.13.0", default-features = false, features = ["std"] }
kurbo = "=0.13.1"
peniko = "=0.6.1"
vello_cpu = "=0.4.0"
vello_gpu = "=0.4.0"
# The glyph type vello_gpu's builder takes, which it does not re-export.
glifo = { version = "=0.5.0", default-features = false, features = ["std"] }
wgpu = "=30.0.2"
pollster = "=1.0.3"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "x11"] }
accesskit = "=0.25.2"
accesskit_winit = "=0.34.2"
accesskit_consumer = "=0.39.2"
kdl = "=6.7.1"
miette = { version = "=7.6.0", features = ["fancy"] }
notify = "=9.0.0"
# The CPU path of the window (design 24 decision 5). No `kms`: no DRM presentation.
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
png = "=0.18.1"
smithay-clipboard = "=0.7.3"
# No `image-data`: only text is read.
arboard = { version = "=3.7.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "webp"] }

# — dev —
wiremock = "0.6"
tempfile = "3"
proptest = "1"

[profile.release]
# The default, written down because it is relied on: the GUI's cover decoder runs inside
# `catch_unwind`, which catches nothing when panics abort.
panic = "unwind"
