# Entry point for CI: pull requests, pushes to main, a weekly run and manual
# runs. Every job lives in ci-jobs.yml; its `CI result` job (check name
# `CI / CI result`) is the only required check.
#
# Pushes to main run everything. Two PRs that are green on their own can
# still break main together, and the push run is the only one that sees the
# combined tree. It also keeps the rust-cache entries fresh: PRs can only
# restore caches saved on the default branch.
#
# The weekly run catches drift no commit causes: runner image, toolchain
# downloads, vanished sources.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

# A newer push to a PR cancels its older run. Every other run has a group of
# its own, so no run on main is ever cancelled or replaced while queued: each
# merged commit gets its own full run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-jobs.yml
    permissions:
      contents: read
      pull-requests: read
