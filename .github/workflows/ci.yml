# Canonical checks (AGENTS.md) on GitHub Actions — no nix here: the toolchain
# comes from rust-toolchain.toml (same 1.99.0 as the flake) via rustup.
# Linux + macOS only (project scope); aarch64-linux cross-builds are out of
# scope for CI — deny.toml still evaluates the full target set statically.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      # -D warnings: warnings are failures, same as locally.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      # nextest is the canonical runner (docs/design/08); the .cargo/config.toml
      # dev-signing runner degrades to plain exec here (no codesigning identity
      # on CI runners) and never signs test binaries (*/deps/*).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Licenses (permissive-only allowlist + gog-warp clarify) and advisories.
      - run: cargo deny check

  build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      # The app itself, in the profile we would ship.
      - run: cargo build --release --workspace
