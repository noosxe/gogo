# cargo-deny configuration — canonical check per AGENTS.md.
# Scope: Linux + macOS only (no Windows target — AGENTS.md). Target-scoping also keeps
# UEFI-only deps (r-efi via getrandom, LGPL) out of the license graph entirely.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
ignore = [
    # bincode 1.x unmaintained (RUSTSEC-2025-0141); transitive via gog-warp (git
    # rev-pin), no safe upgrade available. Unmaintained-only — not a vulnerability.
    # Revisit when gog-warp drops bincode or we vendor its two files (design 09 §4).
    "RUSTSEC-2025-0141",
]

[licenses]
# Permissive-only allowlist. Anything copyleft landing here should fail the build and
# be reviewed, not be added to this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # option-ext (via dirs): file-level copyleft; does not affect linking or the
    # license of the larger work.
    "MPL-2.0",
]

# gog-warp (git rev-pin) ships Apache-2.0 in its LICENSE but has no `license` field in
# its manifest. Clarify assigns the expression so the allowlist applies to it.
# NOTE: cargo-deny does NOT verify the file hash for git deps (any hash passes —
# verified empirically 2026-10-11); the actual content guarantee is the Cargo.toml
# rev pin + Cargo.lock: upstream re-licensing cannot reach a build without a
# deliberate rev bump, which is also when this entry must be re-read.
[[licenses.clarify]]
crate = "gog-warp"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]
