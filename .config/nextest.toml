# Tests that skip themselves at runtime print why; show that output even on
# success so the skip is visible (nextest captures passing tests' output).
[[profile.default.overrides]]
filter = 'test(ficlone) | test(/^btrfs_/)'
success-output = "immediate"

# Move/adopt recovery tests take locks and walk dirs; none should run long.
[[profile.default.overrides]]
filter = 'test(/adopting_the_copy|a_refusal_after_a_recovery|a_move_refused_after|a_copy_whose_source|an_interrupted_move_is_settled/)'
slow-timeout = { period = "30s", terminate-after = 4 }
