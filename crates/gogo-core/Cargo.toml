[package]
name = "gogo-core"
description = "Frontend-agnostic core: GOG auth, catalog, download engine, local state"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The lib name stays `gogo` so all core-internal and frontend code paths read `gogo::…`.
[lib]
name = "gogo"
path = "src/lib.rs"

[features]
# Test doubles for other crates' tests (the snapshot fake backend).
test-util = []

[dependencies]
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
governor.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
quick-xml.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
md-5.workspace = true
sha2.workspace = true
gogo-shims.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
keyring.workspace = true
zeroize.workspace = true
dirs.workspace = true
fs4.workspace = true
tracing.workspace = true
bytesize.workspace = true
gog-warp.workspace = true
object.workspace = true
unicode-normalization.workspace = true
strsim.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The integration tests use the fake snapshot backend (design 20 §10.2).
gogo-core = { path = ".", features = ["test-util"] }
wiremock.workspace = true
tempfile.workspace = true
proptest.workspace = true
