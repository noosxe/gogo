[package]
name = "gogo-ui-ir"
description = "The resolved, renderer-neutral tree between a skin and the engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Serialize the tree (the GUI's dev inspector and snapshot tests). Off by default.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["rc"], optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
